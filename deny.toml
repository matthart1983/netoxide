# cargo-deny policy. Run `cargo deny check` before changing dependencies.
# cargo-vet is not set up yet.

[advisories]
yanked = "deny"
ignore = [
    # `paste` is unmaintained, with no known vulnerability. It comes in through
    # ratatui 0.29 in the TUI prototype only. Drop this when ratatui is upgraded.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro pulled in by ratatui 0.29 (TUI prototype only)" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
