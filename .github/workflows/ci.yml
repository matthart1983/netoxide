name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install what the tests use
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables libnftables1 dnsmasq-base dnsutils curl util-linux iproute2 python3
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Allow unprivileged user namespaces
        # The kernel tests run nftables, the daemon and dnsmasq inside a
        # rootless network namespace, which Ubuntu 24.04 blocks by default.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 && sudo modprobe wireguard
      - name: Test
        # With this set, a kernel test that would skip itself fails instead.
        env:
          OX_REQUIRE_KERNEL_TESTS: "1"
        run: cargo test --workspace
      - name: Web UI syntax
        run: node --check crates/oxd/web/app.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web UI in a browser
        # Sets a blank box up from the setup code and walks every screen in
        # a headless Chrome, inside a private network namespace.
        # OX_WEB_KERNEL=1: the daemon loads real rules and runs dnsmasq there.
        env:
          OX_WEB_KERNEL: "1"
        run: tests/web/run.sh "$RUNNER_TEMP/web-pictures"
      - name: Keep the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-pictures
          path: ${{ runner.temp }}/web-pictures
          if-no-files-found: ignore

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
