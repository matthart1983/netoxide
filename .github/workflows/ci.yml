name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install what the tests use
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables libnftables1 dnsmasq-base dnsutils
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        # Tests that need a user namespace skip themselves with a note when
        # the runner does not allow one.
        run: cargo test --workspace
      - name: Web UI syntax
        run: node --check crates/oxd/web/app.js

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
